build:
  maxIssues: 0

complexity:
  CyclomaticComplexMethod:
    threshold: 20
    ignoreSingleWhenExpression: true
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    threshold: 6
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 95
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 15
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 40
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
  ComplexCondition:
    threshold: 10

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 200
    excludeCommentStatements: true
    excludeRawStrings: true
  ReturnCount:
    max: 10
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
